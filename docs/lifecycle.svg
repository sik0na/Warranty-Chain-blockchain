<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" width="1600" height="820" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" aria-label="WarrantyChain claim lifecycle state machine" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b2430"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5450f"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1600" height="820" fill="#f6f4ef"/>

  <!-- open-claim band -->
  <rect x="210" y="170" width="800" height="230" rx="18" fill="#e3ecf7" />
  <text x="230" y="200" font-size="19" fill="#1e4e8c" font-weight="600">OPEN CLAIM — warranty.hasOpenClaim = true (no second claim allowed)</text>

  <!-- start -->
  <circle cx="90" cy="300" r="16" fill="#1b2430"/>
  <text x="90" y="268" font-size="17" fill="#4b5563" text-anchor="middle">customer</text>
  <line x1="108" y1="300" x2="246" y2="300" stroke="#1b2430" stroke-width="3" marker-end="url(#a)"/>
  <text x="177" y="288" font-size="15" fill="#1b2430" text-anchor="middle" font-family="IBM Plex Mono, monospace">submitClaim()</text>

  <!-- SUBMITTED -->
  <rect x="250" y="245" width="260" height="110" rx="14" fill="#ffffff" stroke="#1b2430" stroke-width="3"/>
  <text x="380" y="295" font-size="30" font-weight="700" fill="#1b2430" text-anchor="middle">SUBMITTED</text>
  <text x="380" y="328" font-size="17" fill="#4b5563" text-anchor="middle">enum value 0</text>

  <!-- APPROVED -->
  <rect x="710" y="245" width="260" height="110" rx="14" fill="#ffffff" stroke="#1b2430" stroke-width="3"/>
  <text x="840" y="295" font-size="30" font-weight="700" fill="#1b2430" text-anchor="middle">APPROVED</text>
  <text x="840" y="328" font-size="17" fill="#4b5563" text-anchor="middle">enum value 1</text>

  <line x1="510" y1="300" x2="706" y2="300" stroke="#1b2430" stroke-width="3" marker-end="url(#a)"/>
  <text x="608" y="288" font-size="15" fill="#1b2430" text-anchor="middle" font-family="IBM Plex Mono, monospace">approveClaim(reason)</text>

  <!-- REPAIRED -->
  <rect x="1180" y="245" width="270" height="110" rx="14" fill="#ffffff" stroke="#0f6b5f" stroke-width="3"/>
  <rect x="1188" y="253" width="254" height="94" rx="9" fill="none" stroke="#0f6b5f" stroke-width="2"/>
  <text x="1315" y="295" font-size="30" font-weight="700" fill="#0f6b5f" text-anchor="middle">REPAIRED</text>
  <text x="1315" y="328" font-size="17" fill="#4b5563" text-anchor="middle">enum 3 · final</text>
  <line x1="970" y1="300" x2="1176" y2="300" stroke="#1b2430" stroke-width="3" marker-end="url(#a)"/>
  <text x="1075" y="288" font-size="15" fill="#1b2430" text-anchor="middle" font-family="IBM Plex Mono, monospace">markRepaired(note)</text>

  <!-- REJECTED -->
  <rect x="710" y="520" width="260" height="110" rx="14" fill="#ffffff" stroke="#b5450f" stroke-width="3"/>
  <rect x="718" y="528" width="244" height="94" rx="9" fill="none" stroke="#b5450f" stroke-width="2"/>
  <text x="840" y="570" font-size="30" font-weight="700" fill="#b5450f" text-anchor="middle">REJECTED</text>
  <text x="840" y="603" font-size="17" fill="#4b5563" text-anchor="middle">enum 2 · final</text>
  <path d="M290 355 L290 575 L706 575" fill="none" stroke="#b5450f" stroke-width="3" marker-end="url(#ao)"/>
  <text x="310" y="560" font-size="18" fill="#b5450f" font-family="IBM Plex Mono, monospace">rejectClaim(reason)</text>

  <!-- guards -->
  <text x="310" y="390" font-size="16" fill="#374151">guard: caller is owner · warranty active · no open claim · description ≠ ""</text>
  <text x="1180" y="390" font-size="16" fill="#374151">only service center · note ≠ ""</text>
  <text x="1180" y="412" font-size="16" fill="#374151">closes the claim</text>
  <text x="310" y="600" font-size="16" fill="#374151">only service center · reason ≠ ""</text>
  <text x="310" y="622" font-size="16" fill="#374151">closes the claim</text>

  <!-- reopen loop -->
  <path d="M1450 355 L1450 470 L90 470 L90 320" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#ag)"/>
  <path d="M710 575 L640 575" fill="none" stroke="none"/>
  <text x="310" y="460" font-size="16" fill="#4b5563">claim closed → hasOpenClaim = false → owner may file a NEW claim (if warranty still active)</text>

  <!-- Warranty mini state -->
  <text x="1180" y="80" font-size="19" fill="#1b2430" font-weight="600">Warranty (derived from time)</text>
  <rect x="1180" y="100" width="150" height="56" rx="28" fill="#ffffff" stroke="#0f6b5f" stroke-width="2.5"/>
  <text x="1255" y="135" font-size="20" font-weight="700" fill="#0f6b5f" text-anchor="middle">ACTIVE</text>
  <rect x="1420" y="100" width="150" height="56" rx="28" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
  <text x="1495" y="135" font-size="20" font-weight="700" fill="#6b7280" text-anchor="middle">EXPIRED</text>
  <line x1="1330" y1="128" x2="1416" y2="128" stroke="#1b2430" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1180" y="182" font-size="15" fill="#4b5563" font-family="IBM Plex Mono, monospace">now &gt; expiresAt (one way)</text>

  <!-- title -->
  <text x="60" y="80" font-size="40" font-weight="700" fill="#1b2430">WarrantyChain — claim lifecycle</text>
  <text x="60" y="118" font-size="20" fill="#4b5563">enum ClaimStatus { Submitted, Approved, Rejected, Repaired }</text>

  <!-- reverts -->
  <rect x="1060" y="490" width="500" height="262" rx="14" fill="#fbeee6" stroke="#b5450f" stroke-width="2"/>
  <text x="1085" y="525" font-size="21" font-weight="700" fill="#b5450f">Invalid transitions → revert</text>
  <text x="1085" y="558" font-size="17" fill="#1b2430">✕ APPROVED → REJECTED</text>
  <text x="1085" y="585" font-size="17" fill="#1b2430">✕ SUBMITTED → REPAIRED (skip approval)</text>
  <text x="1085" y="612" font-size="17" fill="#1b2430">✕ anything out of REJECTED / REPAIRED</text>
  <text x="1085" y="639" font-size="17" fill="#1b2430">✕ new claim while one is open</text>
  <text x="1085" y="666" font-size="17" fill="#1b2430">✕ new claim on an EXPIRED warranty</text>
  <text x="1085" y="693" font-size="17" fill="#1b2430">✕ any decision by shop or customer</text>
  <text x="1085" y="720" font-size="17" fill="#1b2430">✕ unknown claim / warranty id (incl. 0)</text>

  <text x="60" y="798" font-size="15" fill="#6b7280">Each arrow emits an event: ClaimSubmitted · ClaimApproved · ClaimRejected · ClaimRepaired. A claim filed while the warranty was active can still be decided after expiry.</text>
</svg>
